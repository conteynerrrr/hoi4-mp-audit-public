; HOI4 MP Audit 0.1: diagnostic.ini
; Full configuration. Copy as mp_audit.ini next to hoi4.exe.

[audit]
Enabled=1
TrackCommandOrigins=1
SkipEmptyUnknownCommands=0
SkipEngineAICommands=0
CaptureAllCommands=1
IncludeRawPayload=1
OnlyKnownPlayers=0
LogDirectory=mp_audit_logs

[storage]
CompactJSON=0
MaxFileMB=16
CompressRotated=1
GroupMovementBursts=0
MovementBurstWindowMs=50

[tracking]
Units=1
Equipment=1
Production=1
Theaters=1
Construction=1
Templates=1
Politics=1
Diplomacy=1
Deployment=1
AirNavy=1
Movement=1
BattleOrders=1
Network=1
AIInternal=1
Interface=1
Other=1

[commands]
